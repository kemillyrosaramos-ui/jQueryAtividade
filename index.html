<!DOCTYPE html>
<html>
<head>
  <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
</head>
<body>

<button  id="mostrarCadastro">Mostrar Cadastro</button>
  <button id="mostrarLogin">Mostrar Login</button>
 <script> 
  $("#mostrarCadastro").click(function(){
    $("#cadastro").show();
    $('#login').hide();
  });
  $('mostrarlogin').click(function(){
$("#login").show();
$("#cadastro").hide();
  })
  



 </script> 
  <h2>Cadastro</h2>
  <form id="cadastro">
    <p>
      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" required>
    </p>
    <p>
      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" required>
    </p>
    <p>
      <button type="submit">Cadastrar</button>
    </p>
  </form>

  <hr>

  <h2>Login</h2>
  <form id="login">
    <p>
      <label for="login-email">E-mail:</label>
      <input type="email" id="login-email" name="email" required>
    </p>
    <p>
      <label for="login-senha">Senha:</label>
      <input type="password" id="login-senha" name="senha" required>
    </p>
    <p>
      <button type="submit">Entrar</button>
    </p>
  </form>
</body>
</html>
